<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Football Mystic Emblem">
  <defs>
    <linearGradient id="mkGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#E8C97A" />
      <stop offset="100%" stop-color="#9E7324" />
    </linearGradient>
    <linearGradient id="mkDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3622" />
      <stop offset="100%" stop-color="#03140c" />
    </linearGradient>
    <radialGradient id="ballShade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#104a32" />
      <stop offset="60%" stop-color="#072618" />
      <stop offset="100%" stop-color="#020e08" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEBB0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C49A45" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <g transform="translate(32,32)">
    <!-- Outer celestial / mystic orbital rings -->
    <circle r="30" fill="none" stroke="url(#mkGold)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.65" />
    <circle r="27.5" fill="none" stroke="#00e5a3" stroke-width="0.6" opacity="0.5" />
    
    <!-- 4 Cardinal Star Points on outer rim -->
    <circle cx="0" cy="-30" r="1.2" fill="url(#mkGold)" />
    <circle cx="30" cy="0" r="1.2" fill="url(#mkGold)" />
    <circle cx="0" cy="30" r="1.2" fill="url(#mkGold)" />
    <circle cx="-30" cy="0" r="1.2" fill="url(#mkGold)" />

    <!-- Ball Base Sphere -->
    <circle r="25" fill="url(#ballShade)" stroke="url(#mkGold)" stroke-width="1.6" />
    <circle r="25" fill="none" stroke="rgba(255,235,176,0.35)" stroke-width="0.8" />

    <!-- Central Pentagon (Golden Football Panel) -->
    <polygon points="0,-8 7.6,-2.5 4.7,6.5 -4.7,6.5 -7.6,-2.5" 
             fill="url(#mkGold)" stroke="url(#mkGold)" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Inner central emblem accent -->
    <polygon points="0,-5 4.8,-1.5 3,4.1 -3,4.1 -4.8,-1.5" 
             fill="#041a10" opacity="0.88" />
    <circle r="1.8" fill="url(#mkGold)" />

    <!-- Seam lines connecting center pentagon to outer nodes -->
    <line x1="0" y1="-8" x2="0" y2="-17" stroke="url(#mkGold)" stroke-width="1.4" stroke-linecap="round" />
    <line x1="7.6" y1="-2.5" x2="16.2" y2="-5.3" stroke="url(#mkGold)" stroke-width="1.4" stroke-linecap="round" />
    <line x1="4.7" y1="6.5" x2="10" y2="15" stroke="url(#mkGold)" stroke-width="1.4" stroke-linecap="round" />
    <line x1="-4.7" y1="6.5" x2="-10" y2="15" stroke="url(#mkGold)" stroke-width="1.4" stroke-linecap="round" />
    <line x1="-7.6" y1="-2.5" x2="-16.2" y2="-5.3" stroke="url(#mkGold)" stroke-width="1.4" stroke-linecap="round" />

    <!-- Outer Pentagon Panels (Curved / Perspective) -->
    <!-- 1. Top -->
    <path d="M 0,-17 L -7.5,-23.8 C -4,-24.8 4,-24.8 7.5,-23.8 L 0,-17 Z" 
          fill="url(#mkGold)" stroke="url(#mkGold)" stroke-width="1" stroke-linejoin="round" />
    
    <!-- 2. Top-Right -->
    <path d="M 16.2,-5.3 L 17,-14.5 C 21.5,-11.5 24,-7 24.5,-4 L 19.5,2.5 L 16.2,-5.3 Z" 
          fill="url(#mkGold)" stroke="url(#mkGold)" stroke-width="1" stroke-linejoin="round" />

    <!-- 3. Bottom-Right -->
    <path d="M 10,15 L 19.5,12.5 C 20.5,16 18,20 15,22.5 L 6.5,20 L 10,15 Z" 
          fill="url(#mkGold)" stroke="url(#mkGold)" stroke-width="1" stroke-linejoin="round" />

    <!-- 4. Bottom-Left -->
    <path d="M -10,15 L -6.5,20 L -15,22.5 C -18,20 -20.5,16 -19.5,12.5 L -10,15 Z" 
          fill="url(#mkGold)" stroke="url(#mkGold)" stroke-width="1" stroke-linejoin="round" />

    <!-- 5. Top-Left -->
    <path d="M -16.2,-5.3 L -19.5,2.5 L -24.5,-4 C -24,-7 -21.5,-11.5 -17,-14.5 L -16.2,-5.3 Z" 
          fill="url(#mkGold)" stroke="url(#mkGold)" stroke-width="1" stroke-linejoin="round" />

    <!-- Secondary connecting seams for hexagon panels -->
    <line x1="-7.5" y1="-23.8" x2="-17" y2="-14.5" stroke="url(#mkGold)" stroke-width="1" opacity="0.85" />
    <line x1="7.5" y1="-23.8" x2="17" y2="-14.5" stroke="url(#mkGold)" stroke-width="1" opacity="0.85" />
    <line x1="19.5" y1="2.5" x2="19.5" y2="12.5" stroke="url(#mkGold)" stroke-width="1" opacity="0.85" />
    <line x1="6.5" y1="20" x2="-6.5" y2="20" stroke="url(#mkGold)" stroke-width="1" opacity="0.85" />
    <line x1="-19.5" y1="2.5" x2="-19.5" y2="12.5" stroke="url(#mkGold)" stroke-width="1" opacity="0.85" />

    <!-- Sphere 3D lighting reflection highlight -->
    <ellipse cx="-7" cy="-9" rx="14" ry="7" transform="rotate(-30 -7 -9)" fill="url(#goldGlow)" opacity="0.25" pointer-events="none" />
  </g>
</svg>